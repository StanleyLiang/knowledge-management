# REGISTRY: set in .env to point to internal Nexus, e.g.
#   REGISTRY=nexus.internal.example.com:8443/
# Leave empty (default) to pull from Docker Hub.

services:
  postgres:
    image: ${REGISTRY:-}postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: knowledge_base
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  minio:
    image: ${REGISTRY:-}minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 5

  minio-init:
    image: ${REGISTRY:-}minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/videos;
        mc anonymous set download local/videos;
        echo 'Bucket ready (public download)';
      "

  nats:
    image: ${REGISTRY:-}nats:2-alpine
    command: ["-c", "/nats.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
      - "9222:9222"
    volumes:
      - nats-data:/data
      - ./infra/nats.conf:/nats.conf:ro

volumes:
  postgres-data:
  minio-data:
  nats-data:
